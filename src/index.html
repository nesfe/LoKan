<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LoKan — Local kanban board</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><img src="../assets/icon.svg" alt=""><div><strong>LoKan</strong><small>LOCAL KANBAN BOARD</small></div></div>
      <div class="workspace-heading"><span data-i18n="workspace">РАБОЧЕЕ ПРОСТРАНСТВО</span><button type="button" id="add-board" class="icon-button" title="Создать доску" aria-label="Создать доску" data-i18n-title="addBoard" data-i18n-aria="addBoard">＋</button></div>
      <nav id="board-list" class="board-list" aria-label="Доски" data-i18n-aria="boards"></nav>
      <div class="sidebar-bottom">
        <div class="local-pill"><span class="local-dot"></span><div><strong data-i18n="localPrivate">Локально и приватно</strong><small data-i18n="localDetails">Данные на этом устройстве</small></div></div>
        <button id="open-settings" class="sidebar-action" type="button"><span>⚙</span> <span data-i18n="settings">Настройки</span></button>
        <div class="language-switch" role="group" aria-label="Language"><button type="button" data-language="ru">RU</button><button type="button" data-language="en">EN</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span data-i18n="boards">Доски</span><span class="chevron">›</span><strong id="breadcrumb-board"></strong></div>
        <div class="top-actions"><span id="save-state" class="save-state">● Сохранено</span><button id="theme-toggle" class="icon-button top-icon" type="button" title="Сменить тему" aria-label="Сменить тему" data-i18n-title="theme" data-i18n-aria="theme">☾</button></div>
      </header>
      <section class="content-header">
        <div class="title-row"><div><div class="eyebrow" data-i18n="yourBoard">ВАША ДОСКА</div><h1 id="board-title"></h1><p id="board-subtitle"></p></div><div class="header-buttons"><button id="show-archive" class="button secondary" type="button"><span data-i18n="archive">Архив</span> <span id="archive-count" class="button-count">0</span></button><button id="new-card" class="button primary" type="button"><span>＋</span> <span data-i18n="newTask">Новая задача</span></button></div></div>
        <div class="toolbar"><label class="search-field"><span>⌕</span><input id="search" type="search" placeholder="Поиск по задачам..." aria-label="Поиск по задачам" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel"><kbd>⌘ K</kbd></label><select id="filter-priority" aria-label="Фильтр по приоритету" data-i18n-aria="filterPriority"><option value="" data-i18n="allPriorities">Все приоритеты</option><option value="urgent" data-i18n="urgent">Срочно</option><option value="high" data-i18n="high">Высокий</option><option value="medium" data-i18n="medium">Средний</option><option value="low" data-i18n="low">Низкий</option><option value="none" data-i18n="noPriority">Без приоритета</option></select><select id="filter-tag" aria-label="Фильтр по тегу" data-i18n-aria="filterTag"><option value="">Все теги</option></select><select id="filter-due" aria-label="Фильтр по сроку" data-i18n-aria="filterDue"><option value="" data-i18n="allDates">Все сроки</option><option value="overdue" data-i18n="overdue">Просрочены</option><option value="today" data-i18n="today">На сегодня</option><option value="week" data-i18n="week">В ближайшие 7 дней</option><option value="none" data-i18n="noDue">Без срока</option></select><button id="clear-filters" class="text-button" type="button" hidden data-i18n="reset">Сбросить</button></div>
      </section>
      <div class="board-scroll"><div id="board" class="board" aria-label="Канбан-доска" data-i18n-aria="boardLabel"></div></div>
      <footer class="statusbar"><span id="board-stats"></span><span><span data-i18n="footer">Перетащите задачу, чтобы изменить статус ·</span> <kbd>N</kbd> <span data-i18n="footerNewTask">новая задача</span></span></footer>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
